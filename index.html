<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>勤怠QR打刻</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
    font-family:sans-serif;
    text-align:center;
    background:#f5f5f5;
    margin:20px;
}

h2{
    margin-bottom:20px;
}

#reader{
    width:320px;
    margin:auto;
}

#result{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
}

#countdown{
    margin-top:15px;
    font-size:18px;
    color:#666;
}

</style>

</head>

<body>

<h2>勤怠QR打刻</h2>

<div id="reader"></div>

<div id="result">
QRコードをかざしてください
</div>

<div id="countdown"></div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbzfEjEtICMCIMZa_BNMuzL8-EB1S42irYdmLaTX2K1u1Zi5WnEqurLcRfLLWlsF1zCVhQ/exec";

let scanning = true;

let scanner;



function startCountdown(){

    let sec = 5;

    document.getElementById("countdown").innerHTML =
    sec + "秒後に自動的に元の画面へ戻ります";

    const timer = setInterval(function(){

        sec--;

        if(sec>0){

            document.getElementById("countdown").innerHTML =
            sec + "秒後に自動的に元の画面へ戻ります";

        }else{

            clearInterval(timer);

            location.reload();

        }

    },1000);

}



function onScanSuccess(decodedText){

    if(!scanning){

        return;

    }

    scanning = false;

    scanner.clear();

    document.getElementById("result").innerHTML =
    "⏳ 打刻処理中...";



    fetch(GAS_URL,{

        method:"POST",

        body:new URLSearchParams({

            employeeId:decodedText

        })

    })

    .then(response=>response.text())

    .then(text=>{

        const data = JSON.parse(text);

        if(data.result==="DUPLICATE"){

            document.getElementById("result").innerHTML =
            "⚠️ 5分以内の再打刻です";

        }else{

            document.getElementById("result").innerHTML =
            "✅ 打刻完了<br><br>" +
            "社員名：" + data.employeeName + "<br>" +
            "社員番号：" + data.employeeId + "<br>" +
            "区分：" + data.status;

        }

        startCountdown();

    })

    .catch(error=>{

        console.error(error);

        document.getElementById("result").innerHTML =
        "❌ 通信エラー";

        startCountdown();

    });

}



scanner = new Html5QrcodeScanner(

"reader",

{

fps:10,

qrbox:250

},

false

);

scanner.render(onScanSuccess);

</script>

</body>
</html>
