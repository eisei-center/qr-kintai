<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  text-align:center;
  font-family:sans-serif;
}

#reader {
  width:300px;
  margin:auto;
}

#result {
  font-size:22px;
  margin-top:20px;
}
</style>

</head>

<body>

<h2>勤怠QR打刻</h2>

<div id="reader"></div>

<div id="result">
QRコードをかざしてください
</div>


<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbzfEjEtICMCIMZa_BNMuzL8-EB1S42irYdmLaTX2K1u1Zi5WnEqurLcRfLLWlsF1zCVhQ/exec";


function onScanSuccess(decodedText){

document.getElementById("result").innerHTML =
"打刻確認中...";


fetch(GAS_URL,{
method:"POST",
body:new URLSearchParams({
employeeId:decodedText
})
})
.then(res=>res.text())
.then(data=>{


if(data==="DUPLICATE"){

document.getElementById("result").innerHTML =
"⚠️ 5分以内の再打刻です";

}else{

document.getElementById("result").innerHTML =
"✅ 打刻完了<br>社員番号："+decodedText;

}


});


}


const scanner =
new Html5QrcodeScanner(
"reader",
{
fps:10,
qrbox:250
},
false
);


scanner.render(onScanSuccess);


</script>

</body>
</html>
